<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamada</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.2.27/dist/index.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3.2.45/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.2.27/dist/index.full.min.js"></script>
</head>
<body>
  <div id="app">
    <el-container>
      <el-header class="header">
        <span class="title">Yamada</span>
        <span class="subtitle">Local music player</span>
      </el-header>
      <el-main>
        <el-button type="primary" @click="openFile">Open File</el-button>
        <input type="file" ref="fileInput" accept="audio/*" style="display:none" @change="onFileChange">
        <p v-if="fileName">{{ fileName }}</p>
        <div v-if="fileUrl" class="player">
          <el-button @click="togglePlay">{{ playing ? 'Pause' : 'Play' }}</el-button>
          <el-progress :percentage="progress" :stroke-width="4" class="progress" />
          <audio :src="fileUrl" ref="audio" @play="playing = true" @pause="playing = false" @timeupdate="updateProgress"></audio>
        </div>
      </el-main>
    </el-container>
  </div>
  <script src="app.js"></script>
</body>
</html>
