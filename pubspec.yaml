name: yamada
description: "A new Flutter project."
publish_to: 'none'
version: 0.3.0

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI
  # https://pub.dev/packages/fluent_ui
  fluent_ui: ^4.15.1

  # Navigation
  # https://pub.dev/packages/go_router
  go_router: ^17.2.3

  # Desktop
  # https://pub.dev/packages/window_manager
  window_manager: ^0.5.1
  # https://pub.dev/packages/tray_manager
  tray_manager: ^0.5.3

  # State Management
  # https://riverpod.dev
  # https://pub.dev/packages/flutter_riverpod
  flutter_riverpod: ^3.3.1
  # https://pub.dev/packages/riverpod_annotation
  riverpod_annotation: ^4.0.3

  # Storage
  # https://pub.dev/packages/shared_preferences
  shared_preferences: ^2.5.5
  # https://pub.dev/packages/path_provider
  path_provider: ^2.1.6
  # https://pub.dev/packages/package_info_plus
  package_info_plus: ^8.0.0

  # Database
  # https://drift.simonbinder.eu/docs/getting-started
  # https://pub.dev/packages/drift
  drift: ^2.34.3
  # https://pub.dev/packages/drift_flutter
  drift_flutter: ^0.3.1

  # Network
  # https://pub.dev/packages/dio
  dio: ^5.11.0
  # https://pub.dev/packages/dio_cookie_manager
  dio_cookie_manager: ^3.5.0
  # https://pub.dev/packages/cookie_jar
  cookie_jar: ^4.0.9
  # https://pub.dev/packages/rxdart
  rxdart: ^0.28.0

  # Audio
  # https://pub.dev/packages/just_audio
  just_audio: ^0.10.6
  # https://pub.dev/packages/just_audio_windows
  just_audio_windows: ^0.2.3
  # https://pub.dev/packages/audio_session
  audio_session: ^0.2.4
  # https://pub.dev/packages/audio_service
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.4

plugins:
  riverpod_lint: ^3.1.8

flutter:
  uses-material-design: true
  generate: true
